name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: CI / checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check Python syntax
        run: python -m py_compile server.py scripts/upscale_images.py

      - name: Test storefront API
        run: python -m unittest discover -s tests -v

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check product.js
          node --check products.js

      - name: Validate HTML
        run: npx --yes html-validate@11.16.2 index.html product.html
